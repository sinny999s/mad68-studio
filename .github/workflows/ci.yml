name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App (lint, type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mad68-studio
    env:
      # The Electron binary is only needed to run or package the app
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: mad68-studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  firmware:
    name: Firmware (build, emulator checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mad68-cfw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install platformio unicorn -r firmware/requirements.txt

      - name: Build
        run: PIO=pio PY=python bash tools/build.sh

      - name: Check the upgrade-file format
        run: python tools/pack.py --selftest ../firmware

      - name: Emulator checks
        run: >
          python tools/verify_cfw.py out/MAD68HE_libhmk.elf out/MAD68HE_libhmk.img
          ~/.platformio/packages/toolchain-gccarmnoneeabi/bin/arm-none-eabi-nm .

      - name: Stock firmware update-mode request (MAD68 Studio's install from stock)
        run: python tools/stock_update_mode.py

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: mad68-cfw/out/MAD68HE_libhmk.bin
